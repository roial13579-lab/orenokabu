name: Board Analytics Schedule

on:
  schedule:
    # 平日の 日本時間 8:55 (UTC 23:55) と 日本時間 14:55 (UTC 05:55) に起動
    - cron: '55 23 * * 0-4'
    - cron: '55 5 * * 1-5'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: ライブラリのインストール
        run: |
          pip install requests

      - name: スクリプトの実行
        run: |
          python main.py
